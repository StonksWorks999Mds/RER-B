name: Build IPA (iPhone)
on:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#14213a' --splashBackgroundColor '#14213a'
      - run: npx cap sync ios
      - name: Compiler (sans signature)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Fabriquer l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr SimulationTrajetRERB.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RERB-ipa
          path: SimulationTrajetRERB.ipa
